<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>库存管理系统 - 登录</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2 class="login-title">库存管理系统</h2>
            <p class="login-subtitle">请登录以访问系统</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">账号</label>
                    <input type="text" id="username" placeholder="请输入账号" required>
                </div>
                
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
                
                <div class="form-group">
                    <label for="identity">身份</label>
                    <select id="identity" required>
                        <option value="">请选择身份</option>
                        <option value="片区长">片区长</option>
                        <option value="总部综管员">总部综管员</option>
                        <option value="片区综管员">片区综管员</option>
                    </select>
                </div>
                
                <div id="errorMessage" class="error-message"></div>
                
                <button type="submit" class="login-btn">登录</button>
            </form>
        </div>
    </div>
    
    <script src="login.js"></script>
</body>
</html>
