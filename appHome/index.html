<div class="appHome appHomeNew">
    <header class="homeHeader">
        <i class="el-icon-arrow-left" @click="goBack()">
    </header>
    <div class="logoPanel">
        <img src="../../img/appHome/logo.png">
    </div>
    <div class="component-box">
        <el-row :gutter="10" class="content-box1">
            <el-col :span="12" v-for="menu in menus">
                <div class="menu-box"  @click="openMenuDetail(menu)" >

                    <p class="menu-text">{{menu.text}}</p>
                    <img :src="'img/appHome/'+menu.id+'.png'">
                </div>
            </el-col>

        </el-row>
    </div>

    <!-- 巡检模块-安全交底 -->
    <!--安全交底内容-->
    <div class="yd-popup-mask" v-show="safetyVisible"></div>
    <div class="popupStyle" v-show="safetyVisible" style="width: 100%;height: 70%;z-index: 1501;">
        <div class="safetyTitle">
            安全生产常识交底
        </div>
        <div class="safetyContent" v-html="workGuide">
            <div>{{workGuide}}</div>
        </div>
        <div class="safetyBottom">
            <el-checkbox :disabled="!disabBut || !isReadTime" v-model="Allread">我已全部阅读<span v-show="readTime!==0">（{{readTime}}s）</span></el-checkbox>
            <el-button v-show="Allread" type="primary" @click="activeSignature">签名</el-button>
        </div>
    </div>

    <el-dialog
        :visible.sync="changePassword.showDialog"
        width="360px"
        custom-class="password-expire-dialog"
        :close-on-click-modal="false"
        :show-close="true"
    >
        <div class="changePasswordContent">
            <div class="dialogText">密码还有{{changePassword.days}}天过期，请及时修改密码</div>
            <el-button class="dialogBtn" type="primary" @click="showChangePassword">修改密码</el-button>
        </div>
    </el-dialog>


    <ChangePassword  ref="changePassword" />
</div>
